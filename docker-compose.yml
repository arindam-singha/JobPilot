services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: jobpilot-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobpilot-network

  ollama:
    image: ollama/ollama:latest
    container_name: jobpilot-ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobpilot-network

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: jobpilot-ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking Ollama model: $$OLLAMA_MODEL"
        if ! ollama list | awk 'NR > 1 {print $$1}' | grep -Fxq "$$OLLAMA_MODEL"; then
          echo "Pulling $$OLLAMA_MODEL..."
          ollama pull "$$OLLAMA_MODEL"
        else
          echo "Model already available."
        fi
    restart: "no"
    networks:
      - jobpilot-network

  jobpilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpilot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV:-development}
      EVIDENCE_LLM_PROVIDER: ${EVIDENCE_LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      # Explicit values override older model settings in .env.
      OLLAMA_EVIDENCE_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_PROFILE_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_JOB_REQUIREMENTS_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_COVER_LETTER_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      RESUME_LLM_PROVIDER: ${RESUME_LLM_PROVIDER:-ollama}
      OLLAMA_RESUME_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_RESUME_TIMEOUT_SECONDS: ${OLLAMA_RESUME_TIMEOUT_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "8500:8000"
    volumes:
      - .:/app
      # - /app/.venv
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobpilot-network

  jobpilot-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpilot-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JOBPILOT_API_URL: http://jobpilot-api:8000
    depends_on:
      jobpilot-api:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      # - /app/.venv
    command: >-
      uv run streamlit run ui/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
    networks:
      - jobpilot-network

volumes:
  postgres_data:
  ollama_data:

networks:
  jobpilot-network:
    driver: bridge
