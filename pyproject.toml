[project]
name = "jobpilot"
version = "0.1.0"
description = "JobPilot - a human-in-the-loop agentic RAG job application assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.30.*",
    "sqlalchemy==2.0.*",
    "asyncpg==0.29.*",
    "alembic==1.13.*",
    "pydantic==2.8.*",
    "pydantic-settings==2.4.*",
    "psycopg[binary]==3.2.*",
    "python-dotenv==1.0.*",
    "pypdf==5.1.*",
    "python-docx==1.1.*",
    "pgvector>=0.5.0",
    "httpx==0.27.*",
    "reportlab==4.2.*",
    "streamlit==1.49.*",
    "python-multipart==0.0.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-cov==6.0.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
warn_unused_configs = true
files = ["app"]

[tool.alembic]
directory = "alembic"
script_location = "alembic"

[tool.uv]
dev-dependencies = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-cov==6.0.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
]
